name: Build start-cli builder image

on:
  workflow_dispatch:
  push:
    branches: ['master']
    paths: ['.docker/Dockerfile']

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .docker
          push: true
          tags: ghcr.io/bitcoincash1/start-cli-builder:latest
