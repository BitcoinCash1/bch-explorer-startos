name: Tag and Release

on:
  push:
    branches: ['master']
    paths-ignore: ['README.md']
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Setup build environment
        uses: start9labs/shared-workflows/.github/actions/setup-build-env@master

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Find or create developer signing key
        run: |
          if [ -n "${{ secrets.DEV_KEY }}" ]; then
            mkdir -p ~/.startos
            printf '%s' "${{ secrets.DEV_KEY }}" > ~/.startos/developer.key.pem
          else
            start-cli init-key
          fi
        shell: bash

      - name: Auto-bump version for upstream release
        if: github.event_name == 'repository_dispatch'
        run: bash scripts/auto-bump.sh "${{ github.event.client_payload.tag }}"
        shell: bash

      - name: Derive upstream tag from current version graph
        id: upstream
        run: |
          set -euo pipefail
          # Resolve the variable name set as `current` in startos/versions/index.ts
          CURRENT_VAR=$(grep -E '^[[:space:]]*current:' startos/versions/index.ts | head -1 | sed -E 's/.*current:[[:space:]]*([A-Za-z0-9_]+).*/\1/')
          # Map e.g. v_3_10_1_0 -> v3.10.1.0
          VERSION_FILE_BASE=$(echo "$CURRENT_VAR" | sed -E 's/^v_//; s/_/./g')
          VERSION_FILE="startos/versions/v${VERSION_FILE_BASE}.ts"
          # Extract the literal version string e.g. '3.10.1:0' from that file
          VERSION=$(grep -E "version:[[:space:]]*'" "$VERSION_FILE" | head -1 | sed -E "s/.*version:[[:space:]]*'([^']+)'.*/\1/")
          UPSTREAM_TAG="${VERSION%%:*}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_TAG=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"
          echo "Detected upstream tag: ${UPSTREAM_TAG}"
        shell: bash

      - name: Pull explorer images from registry (or build locally as fallback)
        run: |
          set -euo pipefail
          UPSTREAM_TAG="${{ steps.upstream.outputs.UPSTREAM_TAG }}"
          FRONTEND=registry.melroy.org/bitcoincash/bitcoin-cash-explorer/explorer-frontend:"$UPSTREAM_TAG"
          BACKEND=registry.melroy.org/bitcoincash/bitcoin-cash-explorer/explorer-backend:"$UPSTREAM_TAG"

          PULLED=false
          if [ -n "${{ secrets.REGISTRY_MELROY_PASS }}" ]; then
            echo "${{ secrets.REGISTRY_MELROY_PASS }}" | docker login registry.melroy.org -u "${{ secrets.REGISTRY_MELROY_USER }}" --password-stdin
            if docker pull "$FRONTEND" && docker pull "$BACKEND"; then
              echo "Images pulled from registry successfully."
              PULLED=true
            else
              echo "Registry pull failed — falling back to local build."
            fi
          else
            echo "Registry credentials not configured — falling back to local build."
          fi

          if [ "$PULLED" = "false" ]; then
            UPSTREAM_DIR=/tmp/bitcoin-cash-explorer-upstream
            rm -rf "$UPSTREAM_DIR"
            git clone --depth 1 --branch "$UPSTREAM_TAG" https://github.com/BitcoinCash1/bitcoin-cash-explorer.git "$UPSTREAM_DIR"
            (cd "$UPSTREAM_DIR" && ./docker/init.sh "$UPSTREAM_TAG")
            SHORT_SHA=$(git rev-parse --short HEAD)

            echo "FROM node:24-bookworm AS builder" > "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "ARG commitHash" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "ENV DOCKER_COMMIT_HASH=\${commitHash} CYPRESS_INSTALL_BINARY=0 NODE_ENV=production SKIP_SYNC=1" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "WORKDIR /build" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "COPY . ." >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "RUN apt-get update && apt-get install -y build-essential rsync && corepack enable" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "RUN cp explorer-frontend-config.sample.json explorer-frontend-config.json && pnpm install && pnpm build" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "FROM nginx:1.29.4-alpine" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "WORKDIR /patch" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "COPY --from=builder /build/entrypoint.sh /build/wait-for /patch/" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "COPY --from=builder /build/dist/explorer /var/www/explorer" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "COPY --from=builder /build/nginx.conf /etc/nginx/" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "COPY --from=builder /build/nginx-explorer.conf /etc/nginx/conf.d/" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "RUN chmod +x /patch/entrypoint.sh /patch/wait-for" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "RUN chown -R 1000:1000 /patch /var/cache/nginx /var/log/nginx /etc/nginx/nginx.conf /etc/nginx/conf.d /var/www/explorer" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "RUN touch /var/run/nginx.pid && chown 1000:1000 /var/run/nginx.pid" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "USER 1000" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "ENTRYPOINT [\"/patch/entrypoint.sh\"]" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"
            echo "CMD [\"nginx\", \"-g\", \"daemon off;\"]" >> "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos"

            echo "FROM node:24-bookworm AS builder" > "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "ARG commitHash" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "ENV MEMPOOL_COMMIT_HASH=\${commitHash} NODE_ENV=production PATH=\"/root/.cargo/bin:\${PATH}\"" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "RUN apt-get update && apt-get install -y curl build-essential pkg-config libssl-dev ca-certificates" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "RUN curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal && corepack enable" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "WORKDIR /build" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "COPY --chown=node:node . ." >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "COPY --chown=node:node --from=backend . ." >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "COPY --chown=node:node --from=rustgbt . ../rust/" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "ENV FD=/build/rust-gbt" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "RUN mkdir -p rust-gbt && pnpm preinstall && rm -rf node_modules/.pnpm-workspace-state-v1.json && pnpm install --prod && pnpm package" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "FROM node:24-bookworm-slim AS runtime" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "ENV NODE_OPTIONS=--max-old-space-size=16384 NODE_ENV=production" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "WORKDIR /backend" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "RUN chown 1000:1000 ./" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "COPY --from=builder --chown=1000:1000 /build/package ./package/" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "COPY --from=builder --chown=1000:1000 /build/explorer-config-template.json /build/start.sh /build/wait-for-it.sh ./" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "RUN mv explorer-config-template.json explorer-config.json" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "HEALTHCHECK --interval=40s --timeout=20s --start-period=40s --retries=5 CMD node package/healthcheck.js" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "USER 1000" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "EXPOSE 8999" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"
            echo "CMD [\"/backend/start.sh\"]" >> "$UPSTREAM_DIR/docker/backend/Dockerfile.startos"

            docker build --build-arg commitHash="$SHORT_SHA" -t "$FRONTEND" -f "$UPSTREAM_DIR/docker/frontend/Dockerfile.startos" "$UPSTREAM_DIR/frontend"
            docker build --build-context backend="$UPSTREAM_DIR/backend" --build-context rustgbt="$UPSTREAM_DIR/rust" --build-arg commitHash="$SHORT_SHA" -t "$BACKEND" -f "$UPSTREAM_DIR/docker/backend/Dockerfile.startos" "$UPSTREAM_DIR/backend"
          fi

          docker image inspect "$FRONTEND" >/dev/null
          docker image inspect "$BACKEND" >/dev/null
        shell: bash

      - name: Build service packages
        run: |
          RUST_LOG=debug RUST_BACKTRACE=1 make
          echo ""
          echo "SHA256SUMs:"
          sha256sum *.s9pk
        shell: bash

      - name: Generate changelog
        id: meta
        run: |
          FIRST_S9PK=$(ls *.s9pk | head -1)
          TITLE=$(start-cli s9pk inspect "$FIRST_S9PK" manifest | jq -r '.title')
          VERSION=$(start-cli s9pk inspect "$FIRST_S9PK" manifest | jq -r '.version')
          UPSTREAM_TAG="${VERSION%%:*}"
          RELEASE_NOTES=$(start-cli s9pk inspect "$FIRST_S9PK" manifest | jq -r '.releaseNotes // "No release notes provided."')
          {
            echo "## What's Changed"
            echo ""
            echo "Version: ${VERSION}"
            echo ""
            echo "Upstream tag: ${UPSTREAM_TAG}"
            echo ""
            echo "${RELEASE_NOTES}"
            echo ""
            echo "## SHA256 Hashes"
            echo '```'
            sha256sum *.s9pk
            echo '```'
          } > change-log.txt
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Move release tag to current commit
        run: |
          git tag -f "${{ steps.meta.outputs.tag }}"
          git push origin -f "${{ steps.meta.outputs.tag }}"

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }} ${{ steps.meta.outputs.version }}
          prerelease: false
          body_path: change-log.txt
          files: ./*.s9pk
